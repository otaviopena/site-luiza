<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em construção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 30% 20%, #1c2d52 0%, transparent 55%),
      #14213D;
    font-family:'Space Grotesk', sans-serif;
    color:#F5EFE0;
    padding:24px;
    text-align:center;
  }
  .wrap{ max-width:420px; }
  .dots{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#E3A857;
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:32px;
    margin:0 0 12px;
  }
  p{
    font-size:15px;
    line-height:1.6;
    color:rgba(245,239,224,0.7);
    margin:0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dots">· · ·</div>
    <h1>Em construção</h1>
    <p>Esse link já é definitivo — só o conteúdo vai mudar em breve.</p>
  </div>
</body>
</html>
